<div class="container">
    <section class="solicitacao-container">
        <header class="cabecalho">
            <h1>{{ isModoEditor ? 'Editar solicitação' : 'Nova solicitação' }}</h1>
        </header>

        <!-- Corrigido para (ngSubmit) com parênteses -->
        <form (ngSubmit)="salvar()">
            <div class="itens-group">

                <div class="item-form">
                    <label for="softwareId">Software: </label>
                    <select name="softwareId" id="softwareId" [(ngModel)]="solForm.softwareId" required>
                        @for (soft of softwares; track soft.id) {
                            <option [value]="soft.id">{{ soft.nome }}</option>
                        }
                    </select>
                </div>

                <div class="item-form">
                    <label for="lab">Laboratório: </label>
                    <select name="laboratorioId" id="lab" [(ngModel)]="solForm.laboratorioId" required>
                        @for (lab of laboratorios; track lab.id) {
                            <option [value]="lab.id">{{ lab.nome }}</option>
                        }
                    </select>
                </div>

                <div class="item-form">
                    <label for="justificativaUso">Objetivo / Justificativa: </label>
                    <input type="text" name="justificativaUso" id="justificativaUso" [(ngModel)]="solForm.justificativaUso" required>
                </div>

                <div class="item-form">
                    <label for="disciplina">Disciplina: </label>
                    <input type="text" name="disciplina" id="disciplina" [(ngModel)]="solForm.disciplina">
                </div>

                <div class="btn-group">
                    <button type="submit">Salvar</button>
                    <button type="button" class="btn-cancelar" routerLink="/usuario/solicitacoes_software">Cancelar</button>
                </div>

            </div>
        </form>
    </section>
</div>
