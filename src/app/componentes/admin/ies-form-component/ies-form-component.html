<div class="container">
    <header class="cabecalho">
        <h1>Nova Instituição</h1>
    </header>

    <section class="ies-container">

        <form (ngSubmit)="onSubmit()">


            <div class="itemForm">
                <label for="sigla">Sigla</label>
                <input type="text" name="sigla" id="sigla" [(ngModel)]="sigla">

            </div>

            <div class="itemForm campo-grande">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" [(ngModel)]="nome">
            </div> 

            <!--Reitor deveria ser um select com os docentes cadastrados?-->

            <div class="itemForm">
                <label for="reitor">Reitor</label>
                <input type="text" name="reitor" id="reitor" [(ngModel)]="reitor">
            </div>
            <div class="itemForm">
                <label for="telefone">Telefone Central</label>
                <input type="text" name="telefone" id="telefone" [(ngModel)]="telefone">
            </div>
            <div class="itemForm campo-grande">
                <label for="email">E-mail Central</label>
                <input type="email" name="email" id="email" [(ngModel)]="email">
            </div>

            <div class="btnForm">
                <button>Salvar</button>
            </div>


        </form>

    </section>
</div>
