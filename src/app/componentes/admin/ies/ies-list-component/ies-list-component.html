<div class="container">
    <header class="cabecalho">
        <h1>Instituições de Ensino Superior</h1>

        <button (click)="novaIes()">Nova IES</button>
    </header>

    <section class="ies-container">
        <header class="filtros">
            <div class="filtro">
                <label for="sigla">Buscar</label>
                <input type="text" name="sigla" id="sigla" [(ngModel)]="filtroTexto" placeholder="Sigla ou Nome">
            </div>

            <div class="filtro">
                <label for="status">Status</label>
                <select id="status" name="status" [(ngModel)]="filtroStatus">
                    <option value="Todos">Todos</option>
                    <option value="ATIVO">Ativa</option>
                    <option value="INATIVO">Inativa</option>
                </select>
            </div>

        </header>

        <div class="tabela-responsiva">
            <table class="tabela-ies">
                <thead>
                    <th>Sigla</th>
                    <th>Nome</th>
                    <th>Reitor</th>
                    <th>E-mail</th>
                    <th>Status</th>
                    <th>Ações</th>
                </thead>
                <tbody>
                    @for (ies of iesFiltradas(); track ies.id) {
                    <tr>
                        <td>{{ies.sigla}}</td>
                        <td>{{ies.nome}}</td>
                        <td>{{ies.nomeReitor}}</td>
                        <td>{{ies.emailCentral}}</td>
                        @if (ies.status==='ATIVO') {
                        <td class="status-ativa">Ativa</td>
                        } @else {
                        <td class="status-inativa">Inativa</td>
                        }
                        <td class="acoes"> 
                            <div class="btn-group-acoes">
                                <button class="btn-acao" [routerLink]="['/admin/ies/editar', ies.id]">Editar</button>
                                <button class="btn-acao" (click)="alternarStatus(ies.id)">
                                    {{ ies.status === 'ATIVO' ? 'Inativar' : 'Ativar' }}
                                </button>
                            </div>
                        </td>
                    </tr>
                    } @empty {
                    <td colspan="6" class="sem-resultados">Nenhuma IES encontrada.</td>
                    }
                </tbody>
            </table>
        </div>

    </section>
</div>
