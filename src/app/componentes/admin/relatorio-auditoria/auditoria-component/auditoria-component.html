<div class="container">
    <header class="cabecalho">
        <h1>Auditoria</h1>
    </header>

    <section class="auditoria-container">
        <header class="filtros">
            <div class="filtro">
                <label for="nome">Buscar</label>
                <input type="text" name="nome" id="nome" [(ngModel)]="filtroTexto" placeholder="Nome do usuário">
            </div>
        </header>
        <div class="tabela-responsiva">
            <table class="tabela-auditoria">
                <thead>
                    <th>Usuário</th>
                    <th>Entidade</th>
                    <th>Ação</th>
                    <th>Data</th>
                </thead>
                <tbody>
                    @for (log of logsFiltrados(); track log.id) {
                    <tr>
                        <td>{{log.usuarioNome}}</td>
                        <td>{{log.entidade}}</td>
                        <td>{{log.acao}}</td>
                        <td>{{log.dataHora | date: 'dd/MM/yyyy HH:mm:ss'}}</td>
                    </tr>
                    } @empty {
                    <tr colspan="6" class="sem-resultados">Nenhum log encontrado.</tr>
                    }
                </tbody>
            </table>
        </div>

    </section>
</div>
