<div class="container">
    <header class="cabecalho">
        @if(isModoEditor) {
        <h1>Editar Curso</h1>
        }@else {
        <h1>Novo Curso</h1>
        }
    </header>

    <section class="cursos-container">
        <form (ngSubmit)="salvar()">

            <div class="itemForm campo-grande">
                <label for="sigla">Sigla do Curso</label>
                <input type="text" name="sigla" id="sigla" [(ngModel)]="cursoForm().sigla">
            </div>

            <div class="itemForm">
                <label for="coord">Coordenador</label>
                <input type="text" name="coord" id="coord" [(ngModel)]="cursoForm().nomeCoordenador">
            </div>

            <div class="itemForm">
                <label for="caVinc">CA Vinculada</label>
                <select name="caVinc" id="caVinc" [(ngModel)]="cursoForm().centroAcademicoId">
                    @for (ca of centros(); track ca.id) {
                        <option value="{{ca.id}}">{{ca.nome}}</option>
                    }
                </select>
            </div>

            <div class="itemForm campo-grande">
                <label for="desc">Descrição</label>
                <input type="desc" name="desc" id="desc" [(ngModel)]="cursoForm().descricao">
            </div>


            <div class="itemForm">
                <label for="turno">Turno</label>
                <select name="turno" id="turno" [(ngModel)]="cursoForm().turno">
                    <option value="INTEGRAL">Integral</option>
                    <option value="MATUTINO">Matutino</option>
                    <option value="VESPERTINO">Vespertino</option>
                    <option value="NOTURNO">Noturno</option>
                </select>
            </div>

            @if (isModoEditor) {
            <div class="itemForm">
                <label for="status">Status</label>
                <input name="status" id="status" type="text" [(ngModel)]="cursoForm().status" readonly>
            </div>

            <div class="itemForm">
                <label for="data">Data de cadastramento: </label>
                <input type="date" id="data" name="dataCadastramento" [ngModel]="cursoForm().dataCadastramento"
                    (ngModelChange)="cursoForm.set({ ...cursoForm(), dataCadastramento: $event })" readonly>
            </div>
            }


            <div class="btn-group">
                <button type="button" class="btn-cancelar" routerLink="/admin/curso">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
    </section>

</div>
