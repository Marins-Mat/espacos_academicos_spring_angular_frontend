<div class="login-box">
    <h1>Login</h1>

    <form (ngSubmit)="onSubmit()">
        <div class="inputs-box">
            <div>
                <label for="email">E-mail: </label>
                <input type="email" name="email" id="emailinput" [(ngModel)]="email" placeholder="E-mail: " required>
            </div>
            <div>
                <label for="password">Senha: </label>
                <input type="password" name="pass" id="passinput" [(ngModel)]="senha" placeholder="Senha: " required>
            </div>

        </div>

        <button class="loginbtn" type="submit">Login</button>
        
    </form>
</div>
