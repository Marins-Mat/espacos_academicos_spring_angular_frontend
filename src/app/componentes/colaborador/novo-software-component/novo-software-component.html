<div class="container">
    <header class="cabecalho">
        @if(isModoEditor) {
        <h1>Editar Software</h1>
        }@else {
        <h1>Novo Software</h1>
        }
    </header>

    <section class="software-container">
        <form (ngSubmit)="salvar()">

            <div class="campoForm">
                <div class="itensGroup">
                    <div class="itemForm">
                        <label for="softs">Softwares</label>
                        <select name="softs" id="softs" [(ngModel)]="softwareId">
                            @for (soft of softs(); track soft.id) {
                            <option value="{{soft.id}}">{{soft.nome}}</option>
                            }
                        </select>
                    </div>

                    <div class="btn-group">
                        <button type="submit">Salvar</button>
                        <button type="button" class="btn-cancelar" routerLink="/colaborador/ea">Cancelar</button>
                    </div>
                </div>
            </div>
        </form>

    </section>

</div>
