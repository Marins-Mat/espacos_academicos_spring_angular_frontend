<div class="container">
    <header class="cabecalho">
        @if(isModoEditor) {
        <h1>Editar Espaço Acadêmico</h1>
        }@else {
        <h1>Novo Espaço Acadêmico</h1>
        }
    </header>

    <section class="eas-container">
        <form (ngSubmit)="salvar()">

            <div class="campoForm">
                <div class="itensGroup">
                    <div class="itemForm">
                        <label for="sigla">Sigla</label>
                        <input type="text" name="sigla" id="sigla" [(ngModel)]="eaForm().sigla">

                    </div>

                    <div class="itemForm campo-grande">
                        <label for="nome">Nome</label>
                        <input type="text" name="nome" id="nome" [(ngModel)]="eaForm().nome">
                    </div>
                    <div class="itemForm">
                        <label for="tipo">Tipo</label>
                        <select name="tipo" id="tipo" [(ngModel)]="eaForm().tipo">
                            <option value="SALA">Sala</option>
                            <option value="LABORATORIO">Laboratorio</option>
                            <option value="AUDITORIO">Auditorio</option>
                        </select>
                    </div>

                    <div class="itemForm">
                        <label for="capacidadeMax">Capacidade Máxima</label>
                        <input type="number" name="capacidadeMax" id="capacidadeMax"
                            [(ngModel)]="eaForm().capacidadeMaxima">
                    </div>

                    <div class="itemForm campo-grande">
                        <label for="localizacao">Localização</label>
                        <input type="text" name="localizacao" id="localizacao" [(ngModel)]="eaForm().localizacao">
                    </div>

                    <div class="itemForm">
                        <label for="caVinc">CA Vinculada</label>
                        <select name="caVinc" id="caVinc" [(ngModel)]="eaForm().centroAcademicoId">
                            @for (ca of centros(); track ca.id) {
                            <option value="{{ca.id}}">{{ca.nome}}</option>
                            }
                        </select>
                    </div>

                    @if(isModoEditor) {
                    <div class="itemForm">
                        <label for="status">Status</label>
                        <input name="status" id="status" type="text" [(ngModel)]="eaForm().status" readonly>
                    </div>

                    <div class="itemForm">
                        <label for="data">Data de cadastramento: </label>
                        <input type="date" id="data" name="dataCadastramento" [ngModel]="eaForm().dataCadastro"
                            (ngModelChange)="eaForm.set({ ...eaForm(), dataCadastro: $event })" readonly>
                    </div>
                    }
                </div>
                <div class="desc">
                    <div class="itemForm descricao">
                        <label for="descricao">Descricao Complementar</label>
                        <input type="text" name="descricao" id="descricao" [(ngModel)]="eaForm().descricaoComplementar">
                    </div>

                    <div class="itemForm descricao">
                        <label for="esp">Especificação dos computadores</label>
                        <input type="text" name="esp" id="esp" [(ngModel)]="eaForm().tipoComputadores">
                    </div>
                </div>

            </div>

            @if (eaForm().tipo.includes('LABORATORIO') && isModoEditor) {
            <router-outlet></router-outlet>
            } @else {
            <div class="btn-group">
                <button type="submit">Salvar</button>
                <button type="button" class="btn-cancelar" routerLink="/colaborador/ea">Cancelar</button>
            </div>
            }
        </form>
    </section>

</div>
