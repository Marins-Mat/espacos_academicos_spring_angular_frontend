<div class="container">
    <h1>Espaços Acadêmicos </h1>
    <div class="perfil-container">
        <select [value]="perfilAtual()" (change)="trocarPerfil($event)" class="select-perfil">
            @for (perfil of perfisDisponiveis(); track perfil.value) {
            <option [value]="perfil.value" [selected]="perfil.value === perfilAtual()">
                {{ perfil.label }}
            </option>
            }
        </select>
    </div>

    <nav>
        @for (item of menuItens; track item.label) {
        <a [routerLink]="item.route" routerLinkActive="active" class="itemMenu">
            {{item.label}}
        </a>
        }
    </nav>
</div>
