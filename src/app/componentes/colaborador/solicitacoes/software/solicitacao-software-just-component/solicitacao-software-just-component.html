<div class="container">
    <header class="cabecalho">
        <h1>Justificativa de Reprovação</h1>
    </header>

    <div class="infos">
        <p><strong>Software solicitado:</strong> {{ software_nome() }}</p>
        <p><strong>Solicitante:</strong> {{ solicitante_nome() }}</p>
    </div>

    @if (isModoEditor) {
        <div class="form-reprovacao">
            <label for="justificativa">Motivo da reprovação:</label>
            <textarea
                id="justificativa"
                name="justificativa"
                [(ngModel)]="textoJustificativa"
                rows="5"
                placeholder="Informe a justificativa..."
                required></textarea>

            <div class="btn-group">
                <button type="button" (click)="salvarReprovacao()">Salvar Reprovação</button>
                <button type="button" class="btn-cancelar" routerLink="/colaborador/solicitacoes_software">Cancelar</button>
            </div>
        </div>
    } @else {
        <div class="justificativa-box">
            <p><strong>Justificativa cadastrada:</strong></p>
            <p>{{ justificativa() }}</p>
            <button type="button" routerLink="/colaborador/solicitacoes_software">Voltar</button>
        </div>
    }
</div>
